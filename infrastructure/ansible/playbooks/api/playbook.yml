---
- hosts: localhost
  tasks:
    - name: Check if inventory is empty.
      fail:
        msg: "[ERROR] Empty inventory. No host available."
      when: groups.all|length == 0

- hosts: api
  remote_user: admin

  pre_tasks:
    - name: Update apt cache if needed.
      become: true
      apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: geerlingguy.docker
      become: true
      vars:
        docker_users:
          - admin
    - role: traefik
    - role: alloy
      when: (ec2_tags.Environment | default('')) == 'production'
    - role: node_exporter
    - role: api
      vars:
        env_file: production
        api_domain: safetynet-api-production.dump.hr
